<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Daily Mark</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#A8382C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Mark">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFE9DC;
    --paper-raised: #F6F1E6;
    --ink: #2A2A26;
    --ink-soft: #6B6558;
    --line: #CBC2AC;
    --stamp: #A8382C;
    --stamp-soft: #A8382C1a;
    --sage: #56624C;
  }

  body.dark {
    --paper: #1C1B18;
    --paper-raised: #26241F;
    --ink: #E9E4D8;
    --ink-soft: #8C8574;
    --line: #3C3930;
    --stamp: #D46A50;
    --stamp-soft: #D46A501a;
    --sage: #8FA283;
  }

  body { transition: background 0.2s ease, color 0.2s ease; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    display: flex;
    justify-content: center;
    padding: 28px 16px 48px;
    min-height: 100vh;
  }

  .sheet {
    width: 100%;
    max-width: 420px;
  }

  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .habit-tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 10px;
    margin-bottom: 6px;
    -webkit-overflow-scrolling: touch;
  }
  .habit-tabs::-webkit-scrollbar { display: none; }

  .habit-pill {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border: 1px solid var(--line);
    background: var(--paper-raised);
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    border-radius: 16px;
    cursor: pointer;
    white-space: nowrap;
  }
  .habit-pill.active {
    color: var(--ink);
    border-color: var(--pill-color, var(--stamp));
    background: var(--paper);
  }
  .habit-pill.habit-add {
    color: var(--ink-soft);
    font-weight: 600;
    padding: 7px 14px;
  }
  .habit-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .month-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 32px;
    letter-spacing: -0.01em;
  }

  .year {
    font-size: 14px;
    color: var(--ink-soft);
  }

  .nav {
    display: flex;
    gap: 6px;
  }

  .nav button {
    width: 34px;
    height: 34px;
    border: 1px solid var(--line);
    background: var(--paper-raised);
    color: var(--ink);
    font-family: inherit;
    font-size: 16px;
    border-radius: 50%;
    cursor: pointer;
  }
  .nav button:active { background: var(--line); }

  .rule {
    border: none;
    border-top: 1px solid var(--line);
    margin: 14px 0 18px;
  }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 8px;
  }
  .weekdays span {
    text-align: center;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }

  .day {
    position: relative;
    aspect-ratio: 1;
    border: 1px solid var(--line);
    background: var(--paper-raised);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
  }
  .day.empty { visibility: hidden; pointer-events: none; }
  .day.today { border-color: var(--sage); border-width: 1.5px; }

  .day.future {
    cursor: default;
    opacity: 0.4;
    background: var(--paper);
  }
  .day.future:active { background: var(--paper); }

  .day-num {
    font-size: 13px;
    color: var(--ink-soft);
    position: absolute;
    top: 4px;
    left: 6px;
  }

  .day.marked .day-num { color: var(--stamp); opacity: 0.55; }

  .stamp-mark {
    width: 60%;
    height: 60%;
    opacity: 0;
    transform: rotate(-8deg) scale(0.6);
    transition: opacity 0.15s ease, transform 0.18s cubic-bezier(.34,1.56,.64,1);
  }
  .day.marked .stamp-mark {
    opacity: 1;
    transform: rotate(-8deg) scale(1);
  }

  .day:active { background: var(--stamp-soft); }

  .note-dot {
    position: absolute;
    bottom: 5px;
    right: 6px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--sage);
  }

  .toolbar {
    display: flex;
    gap: 6px;
    margin: 12px 0 0;
  }
  .toolbar button {
    flex: 1;
    padding: 9px 6px;
    border: 1px solid var(--line);
    background: var(--paper-raised);
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    border-radius: 6px;
    cursor: pointer;
  }
  .toolbar button:active { background: var(--line); }
  .toolbar button.active {
    color: var(--stamp);
    border-color: var(--stamp);
  }

  .stats-row {
    display: flex;
    justify-content: space-between;
    margin-top: 22px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .stat {
    text-align: center;
    flex: 1;
  }
  .stat .num {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    color: var(--stamp);
  }
  .stat .label {
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
    margin-top: 2px;
  }

  .footer {
    margin-top: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .streak {
    font-family: 'Fraunces', serif;
    font-size: 15px;
    color: var(--ink);
  }
  .streak strong {
    color: var(--stamp);
    font-weight: 600;
  }

  .hint {
    text-align: center;
    margin-top: 22px;
    font-size: 11px;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  /* Year heatmap view */
  .year-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 28px;
    margin-bottom: 14px;
  }
  .year-grid {
    display: grid;
    grid-template-columns: repeat(53, 1fr);
    gap: 2px;
    overflow-x: auto;
  }
  .year-cell {
    aspect-ratio: 1;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 1px;
  }
  .year-cell.marked { background: var(--stamp); border-color: var(--stamp); }
  .year-cell.future { visibility: hidden; }

  .loading {
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
    margin-top: 40px;
  }

  .celebrate-overlay {
    position: fixed;
    inset: 0;
    background: rgba(42,42,38,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    animation: fadeIn 0.2s ease;
    cursor: pointer;
  }
  .celebrate-card {
    background: var(--paper-raised);
    border: 1.5px solid var(--stamp);
    border-radius: 10px;
    padding: 32px 40px;
    text-align: center;
    animation: popIn 0.35s cubic-bezier(.34,1.56,.64,1);
    max-width: 260px;
  }
  .celebrate-stamp {
    font-size: 28px;
    color: var(--stamp);
    border: 2px solid var(--stamp);
    width: 48px;
    height: 48px;
    line-height: 44px;
    border-radius: 50%;
    margin: 0 auto 12px;
    transform: rotate(-8deg);
  }
  .celebrate-num {
    font-family: 'Fraunces', serif;
    font-size: 44px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1;
  }
  .celebrate-label {
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
    margin-top: 4px;
  }
  .celebrate-sub {
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 14px;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(42,42,38,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    animation: fadeIn 0.15s ease;
    padding: 24px;
  }
  .modal-card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 22px;
    width: 100%;
    max-width: 300px;
    animation: popIn 0.2s cubic-bezier(.34,1.56,.64,1);
  }
  .modal-title {
    font-family: 'Fraunces', serif;
    font-size: 19px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .modal-subtitle {
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin-bottom: 12px;
  }
  .modal-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    border-radius: 6px;
    margin: 8px 0 16px;
  }
  .modal-input:focus { outline: none; border-color: var(--stamp); }
  .modal-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .modal-btn {
    flex: 1;
    padding: 10px 8px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    border-radius: 6px;
    cursor: pointer;
    min-width: 70px;
  }
  .modal-btn.primary {
    background: var(--stamp);
    border-color: var(--stamp);
    color: var(--paper-raised);
  }
</style>
</head>
<body>
  <div class="sheet" id="app">
    <div class="loading">Loading your calendar…</div>
  </div>

<script>
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WEEKDAYS = ["S","M","T","W","T","F","S"];
const HABIT_COLORS = ['#A8382C', '#56624C', '#3A5A78', '#8A5A2E', '#6B4A78'];
const MILESTONES = [7, 14, 30, 50, 100, 200, 365];

let view = new Date();
view.setDate(1);
let storageOk = true;
let viewMode = 'month'; // 'month' | 'year'
let yearViewYear = new Date().getFullYear();
let longPressTimer = null;

// In-memory state, loaded from window.storage once at startup and kept in sync on every write.
let habitsList = [];       // [{id, name, color}]
let activeHabitId = null;
let habitData = {};        // { [habitId]: { marks: {"YYYY-MM-DD":true}, notes: {"YYYY-MM-DD":"text"}, celebrated: {"7":true} } }

// ---- storage backend ----
// window.storage exists only inside the Claude.ai artifact sandbox. When this app
// is hosted standalone (GitHub Pages, Netlify, packaged as an APK, etc.) it won't
// exist, so fall back to localStorage with the same async shape.
if (!window.storage) {
  window.storage = {
    async get(key) {
      const v = localStorage.getItem(key);
      return v === null ? null : { key, value: v, shared: false };
    },
    async set(key, value) {
      localStorage.setItem(key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      localStorage.removeItem(key);
      return { key, deleted: true, shared: false };
    },
    async list(prefix) {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && (!prefix || k.startsWith(prefix))) keys.push(k);
      }
      return { keys, prefix, shared: false };
    }
  };
}

// ---- storage helpers (personal/non-shared) ----
async function storageGet(key) {
  try {
    const r = await window.storage.get(key, false);
    return r ? r.value : null;
  } catch (e) { return null; }
}
async function storageSet(key, value) {
  try {
    const r = await window.storage.set(key, value, false);
    if (!r) storageOk = false;
    return !!r;
  } catch (e) { storageOk = false; return false; }
}
async function storageDelete(key) {
  try { await window.storage.delete(key, false); } catch (e) {}
}
async function storageList(prefix) {
  try {
    const r = await window.storage.list(prefix, false);
    return r ? r.keys : [];
  } catch (e) { return []; }
}

function dataKey(habitId) { return `data:${habitId}`; }
function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function monthPrefix(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

function emptyHabitBlob() { return { marks: {}, notes: {}, celebrated: {} }; }

async function loadHabitData(habitId) {
  if (habitData[habitId]) return habitData[habitId];
  const raw = await storageGet(dataKey(habitId));
  let obj = emptyHabitBlob();
  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      obj = { marks: parsed.marks || {}, notes: parsed.notes || {}, celebrated: parsed.celebrated || {} };
    } catch (e) {}
  }
  habitData[habitId] = obj;
  return obj;
}

async function saveHabitData(habitId) {
  await storageSet(dataKey(habitId), JSON.stringify(habitData[habitId]));
}

async function initApp() {
  const rawHabits = await storageGet('habits');
  if (rawHabits) {
    try { habitsList = JSON.parse(rawHabits); } catch (e) { habitsList = []; }
  }
  if (!habitsList || habitsList.length === 0) {
    habitsList = [{ id: 'default', name: 'Daily Mark', color: HABIT_COLORS[0] }];
    await storageSet('habits', JSON.stringify(habitsList));
  }
  activeHabitId = await storageGet('activeHabit');
  if (!activeHabitId || !habitsList.find(h => h.id === activeHabitId)) {
    activeHabitId = habitsList[0].id;
    await storageSet('activeHabit', activeHabitId);
  }
  const dm = await storageGet('darkMode');
  if (dm === '1') document.body.classList.add('dark');

  await loadHabitData(activeHabitId);
}

function currentHabit() {
  let habit = habitsList.find(h => h.id === activeHabitId);
  if (!habit) habit = habitsList[0];
  return habit;
}

async function switchHabit(id) {
  activeHabitId = id;
  await storageSet('activeHabit', id);
  await loadHabitData(id);
}

async function addHabit(name) {
  const id = 'h' + Date.now();
  const color = HABIT_COLORS[habitsList.length % HABIT_COLORS.length];
  habitsList.push({ id, name, color });
  await storageSet('habits', JSON.stringify(habitsList));
  habitData[id] = emptyHabitBlob();
  await saveHabitData(id);
  await switchHabit(id);
}

async function deleteHabit(id) {
  if (habitsList.length <= 1) {
    await showModal({ title: "Can't delete", subtitle: 'You need at least one habit.', showInput: false, buttons: [{ label: 'OK', value: true, primary: true }] });
    return;
  }
  habitsList = habitsList.filter(h => h.id !== id);
  await storageSet('habits', JSON.stringify(habitsList));
  await storageDelete(dataKey(id));
  delete habitData[id];
  if (activeHabitId === id) {
    await switchHabit(habitsList[0].id);
  }
}

function allMarkedDates() {
  // Set of every "YYYY-MM-DD" marked as done for the CURRENT habit
  const data = habitData[activeHabitId] || emptyHabitBlob();
  const set = new Set();
  Object.keys(data.marks).forEach(dk => { if (data.marks[dk]) set.add(dk); });
  return set;
}

function longestStreak() {
  const set = allMarkedDates();
  if (set.size === 0) return 0;
  let longest = 0;
  set.forEach(dk => {
    const [y, m, d] = dk.split('-').map(Number);
    const prev = new Date(y, m - 1, d - 1);
    const prevKey = dateKey(prev);
    if (set.has(prevKey)) return; // not a run start
    let run = 1;
    let cursor = new Date(y, m - 1, d + 1);
    while (set.has(dateKey(cursor))) {
      run++;
      cursor.setDate(cursor.getDate() + 1);
    }
    if (run > longest) longest = run;
  });
  return longest;
}

function computeStreak() {
  // walk backward from today counting consecutive marked days, in-memory
  const set = allMarkedDates();
  let streak = 0;
  let cursor = new Date();
  while (set.has(dateKey(cursor))) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

function exportBackup() {
  const backup = { habits: habitsList, data: {} };
  habitsList.forEach(h => {
    backup.data[h.id] = habitData[h.id] || emptyHabitBlob();
  });
  const jsonStr = JSON.stringify(backup, null, 2);
  const fileName = `daily-mark-backup-${dateKey(new Date())}.json`;
  if (window.AndroidBridge && window.AndroidBridge.exportBackup) {
    window.AndroidBridge.exportBackup(jsonStr, fileName);
    return;
  }
  const blob = new Blob([jsonStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      const incomingHabits = Array.isArray(parsed.habits) ? parsed.habits : [];
      const incomingData = parsed.data && typeof parsed.data === 'object' ? parsed.data : {};
      if (incomingHabits.length === 0 && Object.keys(incomingData).length === 0) {
        await showModal({ title: 'Not a backup file', subtitle: "This doesn't look like a Daily Mark backup.", showInput: false, buttons: [{ label: 'OK', value: true, primary: true }] });
        return;
      }
      const proceed = await showModal({
        title: 'Import backup?',
        subtitle: `${Object.keys(incomingData).length} habit(s) of data found. This merges into what's already saved here — imported marks/notes win on conflicts.`,
        showInput: false,
        buttons: [{ label: 'Import', value: true, primary: true }, { label: 'Cancel', value: null }]
      });
      if (!proceed) return;

      const existingIds = new Set(habitsList.map(h => h.id));
      incomingHabits.forEach(h => { if (h && h.id && !existingIds.has(h.id)) { habitsList.push(h); existingIds.add(h.id); } });
      await storageSet('habits', JSON.stringify(habitsList));

      for (const hid of Object.keys(incomingData)) {
        await loadHabitData(hid); // ensure existing data (if any) is loaded before merge
        const existing = habitData[hid] || emptyHabitBlob();
        const incoming = incomingData[hid] || emptyHabitBlob();
        habitData[hid] = {
          marks: { ...existing.marks, ...(incoming.marks || {}) },
          notes: { ...existing.notes, ...(incoming.notes || {}) },
          celebrated: { ...existing.celebrated, ...(incoming.celebrated || {}) }
        };
        await saveHabitData(hid);
      }

      await showModal({ title: 'Import complete', showInput: false, buttons: [{ label: 'OK', value: true, primary: true }] });
      render();
    } catch (err) {
      showModal({ title: "Couldn't read file", subtitle: "Make sure it's a Daily Mark backup JSON.", showInput: false, buttons: [{ label: 'OK', value: true, primary: true }] });
    }
  };
  reader.readAsText(file);
}

function stampSVG() {
  return `<svg class="stamp-mark" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
    <path d="M9 21 L17 29 L32 11" stroke="var(--stamp)" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

// Replaces window.prompt/alert/confirm, which get blocked in sandboxed preview contexts.
function showModal(opts) {
  return new Promise((resolve) => {
    const buttons = opts.buttons || [
      { label: opts.confirmLabel || 'OK', value: true, primary: true },
      { label: opts.cancelLabel || 'Cancel', value: null }
    ];
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-card">
        ${opts.title ? `<div class="modal-title">${opts.title}</div>` : ''}
        ${opts.subtitle ? `<div class="modal-subtitle">${opts.subtitle}</div>` : ''}
        ${opts.showInput !== false ? `<input class="modal-input" type="text" placeholder="${opts.placeholder || ''}" value="${(opts.inputValue || '').replace(/"/g, '&quot;')}">` : ''}
        <div class="modal-buttons">${buttons.map((b, i) => `<button class="modal-btn${b.primary ? ' primary' : ''}" data-idx="${i}">${b.label}</button>`).join('')}</div>
      </div>
    `;
    document.body.appendChild(overlay);
    const input = overlay.querySelector('.modal-input');
    if (input) { input.focus(); input.select(); }

    const finish = (value) => { overlay.remove(); resolve(value); };

    overlay.querySelectorAll('.modal-btn').forEach((btnEl, i) => {
      btnEl.onclick = () => {
        const b = buttons[i];
        let result = b.value;
        if (result === true && input) result = input.value.trim();
        finish(result);
      };
    });
    overlay.addEventListener('click', (e) => { if (e.target === overlay) finish(null); });
    if (input) {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') overlay.querySelector('.modal-btn.primary')?.click();
      });
    }
  });
}

function celebrateIfMilestone(streak) {
  if (!MILESTONES.includes(streak)) return;
  const data = habitData[activeHabitId];
  const seenKey = String(streak);
  if (data.celebrated[seenKey]) return; // already celebrated this milestone before
  data.celebrated[seenKey] = true;
  saveHabitData(activeHabitId);

  const overlay = document.createElement('div');
  overlay.className = 'celebrate-overlay';
  overlay.innerHTML = `
    <div class="celebrate-card">
      <div class="celebrate-stamp">✓</div>
      <div class="celebrate-num">${streak}</div>
      <div class="celebrate-label">day streak</div>
      <div class="celebrate-sub">Milestone reached — keep going.</div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', () => overlay.remove());
  setTimeout(() => overlay.remove(), 2600);
}

function renderYearGrid(y) {
  const set = allMarkedDates();
  const start = new Date(y, 0, 1);
  const end = new Date(y, 11, 31);
  const startOffset = start.getDay(); // pad so weekday rows line up
  let cellsHtml = '';
  const totalCells = startOffset + (Math.floor((end - start) / 86400000) + 1);
  const cols = Math.ceil(totalCells / 7);
  for (let i = 0; i < startOffset; i++) {
    cellsHtml += `<div class="year-cell future"></div>`;
  }
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const dk = dateKey(d);
    const isFuture = d > new Date();
    cellsHtml += `<div class="year-cell${set.has(dk) ? ' marked' : ''}${isFuture ? ' future' : ''}" title="${dk}"></div>`;
  }
  return { html: cellsHtml, cols };
}

function renderHabitTabs() {
  const active = currentHabit();
  const pills = habitsList.map(h => `
    <button class="habit-pill${h.id === active.id ? ' active' : ''}" data-id="${h.id}" style="--pill-color:${h.color}">
      <span class="habit-dot" style="background:${h.color}"></span>${h.name}
    </button>
  `).join('');
  return `<div class="habit-tabs">${pills}<button class="habit-pill habit-add" id="addHabitBtn">+</button></div>`;
}

function bindHabitTabs() {
  document.querySelectorAll('.habit-pill[data-id]').forEach(el => {
    let pressTimer = null;
    let longPressed = false;
    const id = el.dataset.id;

    const startPress = () => {
      longPressed = false;
      pressTimer = setTimeout(async () => {
        longPressed = true;
        const h = habitsList.find(x => x.id === id);
        if (!h) return;
        const choice = await showModal({
          title: h.name,
          subtitle: 'What would you like to do?',
          showInput: false,
          buttons: [
            { label: 'Rename', value: 'rename' },
            { label: 'Delete', value: 'delete' },
            { label: 'Cancel', value: null }
          ]
        });
        if (choice === 'rename') {
          const newName = await showModal({ title: 'Rename habit', inputValue: h.name, placeholder: 'Habit name', confirmLabel: 'Save' });
          if (newName) {
            h.name = newName;
            await storageSet('habits', JSON.stringify(habitsList));
            render();
          }
        } else if (choice === 'delete') {
          const confirmed = await showModal({
            title: `Delete "${h.name}"?`,
            subtitle: "This removes all its data. This can't be undone.",
            showInput: false,
            buttons: [{ label: 'Delete', value: true, primary: true }, { label: 'Cancel', value: null }]
          });
          if (confirmed) {
            await deleteHabit(id);
            render();
          }
        }
      }, 500);
    };
    const cancelPress = () => clearTimeout(pressTimer);
    el.addEventListener('touchstart', startPress, { passive: true });
    el.addEventListener('touchend', cancelPress);
    el.addEventListener('touchmove', cancelPress);
    el.addEventListener('mousedown', startPress);
    el.addEventListener('mouseup', cancelPress);
    el.addEventListener('mouseleave', cancelPress);

    el.onclick = async () => {
      if (longPressed) { longPressed = false; return; }
      await switchHabit(id);
      render();
    };
  });

  const addBtn = document.getElementById('addHabitBtn');
  if (addBtn) {
    addBtn.onclick = async () => {
      const name = await showModal({ title: 'New habit', placeholder: 'e.g. Reading', confirmLabel: 'Add' });
      if (name) {
        await addHabit(name);
        render();
      }
    };
  }
}

async function render() {
  const app = document.getElementById('app');

  if (viewMode === 'year') {
    const active = currentHabit();
    document.body.style.setProperty('--stamp', active.color);
    document.body.style.setProperty('--stamp-soft', active.color + '1a');
    const { html, cols } = renderYearGrid(yearViewYear);
    const set = allMarkedDates();
    const yearCount = [...set].filter(dk => dk.startsWith(String(yearViewYear))).length;
    app.innerHTML = `
      ${renderHabitTabs()}
      <div class="header">
        <div class="year-title">${yearViewYear}</div>
        <div class="nav">
          <button id="darkBtn" aria-label="Toggle dark mode">${document.body.classList.contains('dark') ? '☀' : '☾'}</button>
          <button id="prevYearBtn" aria-label="Previous year">‹</button>
          <button id="nextYearBtn" aria-label="Next year">›</button>
        </div>
      </div>
      <hr class="rule">
      <div class="year-grid" style="grid-auto-flow: column; grid-template-columns: repeat(${cols}, 1fr); grid-template-rows: repeat(7, 1fr);">${html}</div>
      <div class="footer" style="margin-top:16px;">
        <span>${yearCount} days marked in ${yearViewYear}</span>
      </div>
      <div class="toolbar">
        <button id="monthViewBtn">Month view</button>
        <button id="exportBtn">Export</button>
        <button id="importBtn">Import</button>
      </div>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
    `;
    bindHabitTabs();
    document.getElementById('darkBtn').onclick = toggleDark;
    document.getElementById('prevYearBtn').onclick = () => { yearViewYear--; render(); };
    document.getElementById('nextYearBtn').onclick = () => { yearViewYear++; render(); };
    document.getElementById('monthViewBtn').onclick = () => { viewMode = 'month'; render(); };
    document.getElementById('exportBtn').onclick = exportBackup;
    document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
    document.getElementById('importFile').onchange = (e) => {
      if (e.target.files[0]) importBackup(e.target.files[0]);
    };
    return;
  }

  const data = habitData[activeHabitId] || emptyHabitBlob();
  const prefix = monthPrefix(view);
  const marks = {};
  const notes = {};
  Object.keys(data.marks).forEach(k => { if (k.startsWith(prefix)) marks[k] = data.marks[k]; });
  Object.keys(data.notes).forEach(k => { if (k.startsWith(prefix)) notes[k] = data.notes[k]; });

  const year = view.getFullYear();
  const month = view.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = new Date();
  const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;

  let cells = '';
  for (let i = 0; i < firstDay; i++) {
    cells += `<div class="day empty"></div>`;
  }
  const todayMidnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  for (let day = 1; day <= daysInMonth; day++) {
    const dk = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const isMarked = !!marks[dk];
    const isToday = isCurrentMonth && today.getDate() === day;
    const isFuture = new Date(year, month, day) > todayMidnight;
    const hasNote = !!notes[dk];
    cells += `<div class="day${isMarked ? ' marked' : ''}${isToday ? ' today' : ''}${isFuture ? ' future' : ''}" data-key="${dk}"${isFuture ? ' data-future="1"' : ''} title="${hasNote ? notes[dk].replace(/"/g,'&quot;') : ''}">
      <span class="day-num">${day}</span>
      ${stampSVG()}
      ${hasNote ? '<span class="note-dot"></span>' : ''}
    </div>`;
  }

  const markedCount = Object.keys(marks).filter(k => marks[k]).length;
  const streak = computeStreak();
  const best = longestStreak();
  const active = currentHabit();
  document.body.style.setProperty('--stamp', active.color);
  document.body.style.setProperty('--stamp-soft', active.color + '1a');

  app.innerHTML = `
    ${renderHabitTabs()}
    <div class="header">
      <div>
        <div class="month-title">${MONTH_NAMES[month]}</div>
        <div class="year">${year}</div>
      </div>
      <div class="nav">
        <button id="darkBtn" aria-label="Toggle dark mode">${document.body.classList.contains('dark') ? '☀' : '☾'}</button>
        <button id="prevBtn" aria-label="Previous month">‹</button>
        <button id="nextBtn" aria-label="Next month">›</button>
      </div>
    </div>
    <hr class="rule">
    <div class="weekdays">${WEEKDAYS.map(w => `<span>${w}</span>`).join('')}</div>
    <div class="grid">${cells}</div>
    <div class="stats-row">
      <div class="stat"><div class="num">${markedCount}/${daysInMonth}</div><div class="label">this month</div></div>
      <div class="stat"><div class="num">${streak}</div><div class="label">current streak</div></div>
      <div class="stat"><div class="num">${best}</div><div class="label">longest streak</div></div>
    </div>
    <div class="toolbar">
      <button id="yearViewBtn">Year view</button>
      <button id="exportBtn">Export</button>
      <button id="importBtn">Import</button>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
    <div class="hint">Tap to mark. Hold a day to add a note.${storageOk ? '' : " (Storage unavailable — marks won't be saved.)"}</div>
  `;

  bindHabitTabs();
  document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
  document.getElementById('importFile').onchange = (e) => {
    if (e.target.files[0]) importBackup(e.target.files[0]);
  };

  document.getElementById('darkBtn').onclick = toggleDark;
  document.getElementById('prevBtn').onclick = () => {
    view.setMonth(view.getMonth() - 1);
    render();
  };
  document.getElementById('nextBtn').onclick = () => {
    view.setMonth(view.getMonth() + 1);
    render();
  };
  document.getElementById('yearViewBtn').onclick = () => {
    yearViewYear = view.getFullYear();
    viewMode = 'year';
    render();
  };
  document.getElementById('exportBtn').onclick = exportBackup;

  document.querySelectorAll('.day[data-key]').forEach(el => {
    if (el.dataset.future) return;
    const key = el.dataset.key;
    let longPressed = false;

    const startPress = () => {
      longPressed = false;
      longPressTimer = setTimeout(async () => {
        longPressed = true;
        const d = habitData[activeHabitId];
        const existing = d.notes[key] || '';
        const text = await showModal({
          title: 'Note for this day',
          subtitle: 'Leave blank to remove.',
          inputValue: existing,
          placeholder: 'Add a note…',
          confirmLabel: 'Save'
        });
        if (text === null) return;
        if (text.trim() === '') { delete d.notes[key]; } else { d.notes[key] = text.trim(); }
        await saveHabitData(activeHabitId);
        render();
      }, 480);
    };
    const cancelPress = () => clearTimeout(longPressTimer);

    el.addEventListener('touchstart', startPress, { passive: true });
    el.addEventListener('touchend', cancelPress);
    el.addEventListener('touchmove', cancelPress);
    el.addEventListener('mousedown', startPress);
    el.addEventListener('mouseup', cancelPress);
    el.addEventListener('mouseleave', cancelPress);

    el.onclick = async () => {
      if (longPressed) { longPressed = false; return; }
      const d = habitData[activeHabitId];
      const nowMarked = !d.marks[key];
      d.marks[key] = nowMarked;
      render();
      await saveHabitData(activeHabitId);
      if (nowMarked) {
        const streak = computeStreak();
        celebrateIfMilestone(streak);
      }
    };
  });
}

async function toggleDark() {
  document.body.classList.toggle('dark');
  await storageSet('darkMode', document.body.classList.contains('dark') ? '1' : '0');
  render();
}

(async function start() {
  await initApp();
  render();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
